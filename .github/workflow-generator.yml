workflow:
  generator:
    project:
      java:
        versions:
          primary: 25
    workflows:
      release-tools:
        uses: spring-io/spring-security-actions@266e718d1d7c8ad623ac22f63e34ecc64cae561b # 0.0.38
        ci:
          name: continuous-integration-workflow
        pr:
          name: pr-build-workflow
        deploy-schema: true
        verify: false
      release-train:
        build:
          env:
            COMMERCIAL_REPO_USERNAME: secrets.COMMERCIAL_ARTIFACTORY_USERNAME
            COMMERCIAL_REPO_PASSWORD: secrets.COMMERCIAL_ARTIFACTORY_PASSWORD
        test:
          env:
            COMMERCIAL_REPO_USERNAME: secrets.COMMERCIAL_ARTIFACTORY_USERNAME
            COMMERCIAL_REPO_PASSWORD: secrets.COMMERCIAL_ARTIFACTORY_PASSWORD

