workflow:
  generator:
    project:
      java:
        versions:
          primary: 17
    workflows:
      release-tools:
        uses: spring-io/spring-security-actions@3d12f90253904da59a24c22b96c2cd0d6cec739a # 0.0.37
        ci:
          name: continuous-integration-workflow
        pr:
          name: pr-build-workflow
        deploy-schema: true
        verify: false
      release-train:
        build:
          env:
            COMMERCIAL_REPO_USERNAME: secrets.COMMERCIAL_ARTIFACTORY_USERNAME
            COMMERCIAL_REPO_PASSWORD: secrets.COMMERCIAL_ARTIFACTORY_PASSWORD
        test:
          env:
            COMMERCIAL_REPO_USERNAME: secrets.COMMERCIAL_ARTIFACTORY_USERNAME
            COMMERCIAL_REPO_PASSWORD: secrets.COMMERCIAL_ARTIFACTORY_PASSWORD

