name: Test Release
description: Tests the release train
runs:
  using: composite
  steps:
    - id: environment
      name: Compute Build Environment
      uses: spring-io/spring-security-actions/compute-build-environment@fb60de7ce6004db5cf697c61f69ab33e61673a47 # 0.0.33
    - name: Test Release
      uses: spring-io/spring-security-actions/run-gradle@fb60de7ce6004db5cf697c61f69ab33e61673a47 # 0.0.33
      env:
        ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
      with:
        gradle-args: build
