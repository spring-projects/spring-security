name: Test Release
description: Tests the release train
runs:
  using: composite
  steps:
    - id: environment
      name: Compute Build Environment
      uses: spring-io/spring-security-actions/compute-build-environment@3ae398a0c859ac737e5197f2ef776929bcd9db70 # 0.0.25
    - name: Test Release
      uses: spring-io/spring-security-actions/run-gradle@3ae398a0c859ac737e5197f2ef776929bcd9db70 # 0.0.25
      env:
        ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
      with:
        gradle-args: build
