name: Test Release
description: Tests the release train
runs:
  using: composite
  steps:
    - id: environment
      name: Compute Build Environment
      uses: spring-io/spring-security-actions/compute-build-environment@638e8ab304fc07680b8274a178a180f5ba9ae8ee # 0.0.21
    - name: Test Release
      uses: spring-io/spring-security-actions/run-gradle@638e8ab304fc07680b8274a178a180f5ba9ae8ee # 0.0.21
      env:
        ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
      with:
        gradle-args: build
