name: Test Release
description: Tests the release train
runs:
  using: composite
  steps:
    - id: environment
      name: Compute Build Environment
      uses: spring-io/spring-security-actions/compute-build-environment@062dd632ff2ceec82ce89d494ebb1f072476ddc2 # 0.0.22
    - name: Test Release
      uses: spring-io/spring-security-actions/run-gradle@062dd632ff2ceec82ce89d494ebb1f072476ddc2 # 0.0.22
      env:
        ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
      with:
        gradle-args: build
