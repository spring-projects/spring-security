name: Test Release
description: Tests the release train
runs:
  using: composite
  steps:
    - id: environment
      name: Compute Build Environment
      uses: spring-io/spring-security-actions/compute-build-environment@8a4a2256b0787c7551b0e847b0cdd2392c89ab7b # 0.0.29
    - name: Test Release
      uses: spring-io/spring-security-actions/run-gradle@8a4a2256b0787c7551b0e847b0cdd2392c89ab7b # 0.0.29
      env:
        ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
      with:
        gradle-args: build
