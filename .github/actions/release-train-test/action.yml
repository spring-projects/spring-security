name: Test Release
description: Tests the release train
runs:
  using: composite
  steps:
    - id: environment
      name: Compute Build Environment
      uses: spring-io/spring-security-actions/compute-build-environment@67cffedb9c62c5a13ba30e9ee60b20088ff20a52 # 0.0.23
    - name: Test Release
      uses: spring-io/spring-security-actions/run-gradle@67cffedb9c62c5a13ba30e9ee60b20088ff20a52 # 0.0.23
      env:
        ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
      with:
        gradle-args: build
