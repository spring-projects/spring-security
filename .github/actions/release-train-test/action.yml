name: Test Release
description: Tests the release train
runs:
  using: composite
  steps:
    - id: environment
      name: Compute Build Environment
      uses: spring-io/spring-security-actions/compute-build-environment@684ca83d1b00d67326499eb02e6517d4f5bd73d1 # 0.0.32
    - name: Test Release
      uses: spring-io/spring-security-actions/run-gradle@684ca83d1b00d67326499eb02e6517d4f5bd73d1 # 0.0.32
      env:
        ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
      with:
        gradle-args: build
