name: Test Release
description: Tests the release train
runs:
  using: composite
  steps:
    - id: environment
      name: Compute Build Environment
      uses: spring-io/spring-security-actions/compute-build-environment@5707602cd3a5b457f27691c2160115f35f1b0063 # 0.0.28
    - name: Test Release
      uses: spring-io/spring-security-actions/run-gradle@5707602cd3a5b457f27691c2160115f35f1b0063 # 0.0.28
      env:
        ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
      with:
        gradle-args: build
