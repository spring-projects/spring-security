name: Build Release
description: Builds the release train
runs:
  using: composite
  steps:
    - id: environment
      name: Compute Build Environment
      uses: spring-io/spring-security-actions/compute-build-environment@1b4c6e8e5092d555396905fd00d863139dfcd9ba # 0.0.30
    - name: Build Release
      uses: spring-io/spring-security-actions/run-gradle@1b4c6e8e5092d555396905fd00d863139dfcd9ba # 0.0.30
      env:
        ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
      with:
        gradle-args: --no-build-cache -PdeploymentRepository=${{ github.workspace }}/deployment-repository publishAllPublicationsToDeploymentRepository
