name: Build Release
description: Builds the release train
runs:
  using: composite
  steps:
    - id: environment
      name: Compute Build Environment
      uses: spring-io/spring-security-actions/compute-build-environment@266e718d1d7c8ad623ac22f63e34ecc64cae561b # 0.0.38
    - name: Build Release
      uses: spring-io/spring-security-actions/run-gradle@266e718d1d7c8ad623ac22f63e34ecc64cae561b # 0.0.38
      env:
        ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
      with:
        gradle-args: --no-build-cache -PdeploymentRepository=${{ github.workspace }}/deployment-repository publishAllPublicationsToDeploymentRepository
