name: Build Release
description: Builds the release train
runs:
  using: composite
  steps:
    - id: environment
      name: Compute Build Environment
      uses: spring-io/spring-security-actions/compute-build-environment@0775821cbcabf7b0a3289c8b49e8bf93aaa6ecab # 0.0.20
    - name: Build Release
      uses: spring-io/spring-security-actions/run-gradle@0775821cbcabf7b0a3289c8b49e8bf93aaa6ecab # 0.0.20
      env:
        ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
      with:
        gradle-args: --no-build-cache -PdeploymentRepository=${{ github.workspace }}/deployment-repository publishAllPublicationsToDeploymentRepository
