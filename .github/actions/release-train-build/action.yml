name: Build Release
description: Builds the release train
runs:
  using: composite
  steps:
    - id: environment
      name: Compute Build Environment
      uses: spring-io/spring-security-actions/compute-build-environment@c68437be61d8d4aaed42e24fb7bf8749397cbc28 # 0.0.24
    - name: Build Release
      uses: spring-io/spring-security-actions/run-gradle@c68437be61d8d4aaed42e24fb7bf8749397cbc28 # 0.0.24
      env:
        ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
      with:
        gradle-args: --no-build-cache -PdeploymentRepository=${{ github.workspace }}/deployment-repository publishAllPublicationsToDeploymentRepository
