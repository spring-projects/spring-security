name: Build Release
description: Builds the release train
runs:
  using: composite
  steps:
    - id: environment
      name: Compute Build Environment
      uses: spring-io/spring-security-actions/compute-build-environment@663f2fac7d57e6b535f85745b1930ddad8e7f4f8 # 0.0.31
    - name: Build Release
      uses: spring-io/spring-security-actions/run-gradle@663f2fac7d57e6b535f85745b1930ddad8e7f4f8 # 0.0.31
      env:
        ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
      with:
        gradle-args: --no-build-cache -PdeploymentRepository=${{ github.workspace }}/deployment-repository publishAllPublicationsToDeploymentRepository
