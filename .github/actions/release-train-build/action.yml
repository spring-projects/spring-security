name: Build Release
description: Builds the release train
runs:
  using: composite
  steps:
    - id: environment
      name: Compute Build Environment
      uses: spring-io/spring-security-actions/compute-build-environment@ffcef17d3ba156b33fe73535fbd79594ed02b0f8 # 0.0.35
    - name: Build Release
      uses: spring-io/spring-security-actions/run-gradle@ffcef17d3ba156b33fe73535fbd79594ed02b0f8 # 0.0.35
      env:
        ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
      with:
        gradle-args: --no-build-cache -PdeploymentRepository=${{ github.workspace }}/deployment-repository publishAllPublicationsToDeploymentRepository
