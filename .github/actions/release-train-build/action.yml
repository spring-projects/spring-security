name: Build Release
runs:
  using: composite
  steps:
    - id: environment
      name: Compute Build Environment
      uses: spring-io/spring-security-actions/compute-build-environment@main # TODO pin after the next spring-security-actions release
    - name: Build Release
      uses: spring-io/spring-security-actions/run-gradle@96df48300f5fa058d0765832d48a534cc6a378d5  # 0.0.3
      env:
        ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
      with:
        gradle-args: --no-build-cache -PdeploymentRepository=${{ github.workspace }}/deployment-repository publishAllPublicationsToDeploymentRepository
