name: Build Release
description: Builds the release train
runs:
  using: composite
  steps:
    - id: environment
      name: Compute Build Environment
      uses: spring-io/spring-security-actions/compute-build-environment@bd3cae229836f13ec484a981b94caf041e8cb4d9 # 0.0.28
    - name: Build Release
      uses: spring-io/spring-security-actions/run-gradle@bd3cae229836f13ec484a981b94caf041e8cb4d9 # 0.0.28
      env:
        ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
      with:
        gradle-args: --no-build-cache -PdeploymentRepository=${{ github.workspace }}/deployment-repository publishAllPublicationsToDeploymentRepository
