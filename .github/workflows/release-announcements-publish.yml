name: Release Announcements - Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish
        required: true
        type: string

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  deploy-schema:
    name: Deploy Schema
    uses: spring-io/spring-security-release-tools/.github/workflows/deploy-schema.yml@d1199a03aee6023578d50c34ec6f09e37889672c # v1.0.19
    with:
      should-deploy-schema: true
    secrets: inherit
  publish-release-announcements:
    name: Publish Release Announcements
    needs: [ deploy-schema ]
    if: ${{ !github.event.repository.fork }}
    uses: spring-io/spring-security-release-tools/.github/workflows/release-announcements-publish.yml@33d8b6e0a246353d4b659d7676173436a302ab2b # v1.0.18
    with:
      version: ${{ inputs.version }}
    secrets: inherit
