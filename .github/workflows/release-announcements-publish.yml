name: Release Announcements - Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-release-materials:
    name: Publish Release Announcements
    permissions:
      actions: write
      contents: read
      issues: write
    uses: spring-io/spring-security-actions/.github/workflows/release-announcements-publish.yml@266e718d1d7c8ad623ac22f63e34ecc64cae561b # 0.0.38
    with:
      version: ${{ inputs.version }}
    secrets:
      website-token: ${{ secrets.SPRING_RELEASE_GCHAT_WEBHOOK_URL }}
  deploy-schema:
    name: Deploy Schema
    needs: publish-release-materials
    if: vars.DEPLOY_SCHEMA == 'true'
    uses: spring-io/spring-security-actions/.github/workflows/ci-deploy-schema.yml@266e718d1d7c8ad623ac22f63e34ecc64cae561b # 0.0.38
    with:
      java-version: '25'
      runner: ${{ vars.UBUNTU_RUNS_ON }}
    secrets:
      docs-ssh-key: ${{ secrets.DOCS_SSH_KEY }}
      docs-username: ${{ secrets.DOCS_USERNAME }}
      docs-host: ${{ secrets.DOCS_HOST }}
