name: Release Announcements - Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish
        required: true

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  publish-release-announcements:
    name: Publish Release Announcements
    uses: spring-io/spring-security-release-tools/.github/workflows/release-announcements-publish.yml@c6656e0cee9fd2930ad238f6e1cafb0b8792e515 # v1.1.0
    with:
      version: ${{ inputs.version }}
    secrets: inherit
