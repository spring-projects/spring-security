name: Release Announcements - Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  setup:
    name: Compute Inputs
    runs-on: ubuntu-latest
    outputs:
      release-channel: ${{ steps.environment.outputs.release-channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: environment
        name: Compute Build Environment
        uses: spring-io/spring-security-actions/compute-build-environment@fb60de7ce6004db5cf697c61f69ab33e61673a47 # 0.0.33
  deploy-schema:
    name: Deploy Schema
    needs: setup
    if: needs.setup.outputs.release-channel == 'oss'
    uses: spring-io/spring-security-release-tools/.github/workflows/ci-deploy-schema.yml@68b6e66d754df7b18604ac8e120a92ee64a336d3 # v1.1.7
    with:
      java-version: '17'
      runner: ${{ vars.UBUNTU_RUNS_ON }}
    secrets:
      docs-ssh-key: ${{ secrets.DOCS_SSH_KEY }}
      docs-username: ${{ secrets.DOCS_USERNAME }}
      docs-host: ${{ secrets.DOCS_HOST }}
  publish-release-announcements:
    name: Publish Release Announcements
    permissions:
      actions: write
      contents: read
      issues: write
    needs: [ deploy-schema ]
    if: ${{ !failure() && !cancelled() }}
    uses: spring-io/spring-security-release-tools/.github/workflows/release-announcements-publish.yml@68b6e66d754df7b18604ac8e120a92ee64a336d3 # v1.1.7
    with:
      version: ${{ inputs.version }}
    secrets:
      SPRING_RELEASE_GCHAT_WEBHOOK_URL: ${{ secrets.SPRING_RELEASE_GCHAT_WEBHOOK_URL }}
