name: CI

on:
  push:
    branches:
      - "main"
      - "*.x"
      - "embargoed/**"
  schedule:
    - cron: '0 10 * * *' # Once per day at 10am UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: read

jobs:
  setup:
    name: Compute Inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.environment.outputs.version }}
      snapshot: ${{ steps.environment.outputs.snapshot }}
      release-channel: ${{ steps.environment.outputs.release-channel }}
      dependencies-username: ${{ steps.environment.outputs.dependencies-username }}
      dependencies-password: ${{ steps.environment.outputs.dependencies-password }}
      publishing-username: ${{ steps.environment.outputs.publishing-username }}
      publishing-password: ${{ steps.environment.outputs.publishing-password }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: environment
        name: Compute Build Environment
        uses: spring-io/spring-security-actions/compute-build-environment@c68437be61d8d4aaed42e24fb7bf8749397cbc28 # 0.0.24
  build:
    name: Build
    needs: setup
    if: needs.setup.outputs.snapshot == 'true'
    uses: spring-io/spring-security-release-tools/.github/workflows/ci-build.yml@2da533f3d91484ee6a9346677473649e6cd08988 # v1.1.3
    with:
      java-version: '25'
      runner: ${{ vars.UBUNTU_RUNS_ON }}
      release-channel: ${{ needs.setup.outputs.release-channel }}
    secrets:
      artifactory-username: ${{ secrets[needs.setup.outputs.dependencies-username] }}
      artifactory-password: ${{ secrets[needs.setup.outputs.dependencies-password] }}
      signing-key: ${{ secrets.GPG_PRIVATE_KEY }}
      signing-password: ${{ secrets.GPG_PASSPHRASE }}
  deploy-artifacts:
    name: Deploy Artifacts
    needs: [ setup, build ]
    uses: spring-io/spring-security-release-tools/.github/workflows/ci-deploy-artifacts.yml@2da533f3d91484ee6a9346677473649e6cd08988 # v1.1.3
    with:
      runner: ${{ vars.UBUNTU_RUNS_ON }}
      version: ${{ needs.setup.outputs.version }}
    secrets:
      artifactory-username: ${{ secrets[needs.setup.outputs.publishing-username] }}
      artifactory-password: ${{ secrets[needs.setup.outputs.publishing-password] }}
  deploy-schema:
    name: Deploy Schema
    needs: [ setup, deploy-artifacts ]
    if: needs.setup.outputs.release-channel == 'oss'
    uses: spring-io/spring-security-release-tools/.github/workflows/ci-deploy-schema.yml@2da533f3d91484ee6a9346677473649e6cd08988 # v1.1.3
    with:
      java-version: '25'
      runner: ${{ vars.UBUNTU_RUNS_ON }}
    secrets:
      docs-ssh-key: ${{ secrets.DOCS_SSH_KEY }}
      docs-username: ${{ secrets.DOCS_USERNAME }}
      docs-host: ${{ secrets.DOCS_HOST }}
