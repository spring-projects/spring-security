name: Dependabot - Build Pull Request

on: pull_request

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORG_GRADLE_PROJECT_branch: ${{ github.base_ref }}
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build
    runs-on: ${{ vars.UBUNTU_RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 60
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: environment
        name: Compute Build Environment
        uses: spring-io/spring-security-actions/compute-build-environment@266e718d1d7c8ad623ac22f63e34ecc64cae561b # 0.0.38
      - uses: spring-io/spring-security-actions/pr-build@266e718d1d7c8ad623ac22f63e34ecc64cae561b # 0.0.38
        env:
          ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
          ORG_GRADLE_PROJECT_artifactoryUsername: ${{ secrets.ARTIFACTORY_RO_USERNAME || '' }}
          ORG_GRADLE_PROJECT_artifactoryPassword: ${{ secrets.ARTIFACTORY_RO_PASSWORD || '' }}
        with:
          java-version: ${{ env.JAVA_VERSION }}
  build-check:
    name: Build
    needs: build
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
