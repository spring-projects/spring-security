name: Dependabot - Build Pull Request

on: pull_request

permissions:
  contents: read

env:
  ORG_GRADLE_PROJECT_branch: ${{ github.base_ref }}
  JAVA_VERSION: '25'

jobs:
  build:
    name: Build
    runs-on: ${{ vars.UBUNTU_RUNS_ON }}
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: environment
        name: Compute Build Environment
        uses: spring-io/spring-security-actions/compute-build-environment@3ae398a0c859ac737e5197f2ef776929bcd9db70 # 0.0.25
      - uses: spring-io/spring-security-actions/pr-build@3ae398a0c859ac737e5197f2ef776929bcd9db70 # 0.0.25
        env:
          ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
          ORG_GRADLE_PROJECT_artifactoryUsername: ${{ secrets[steps.environment.outputs.dependabot-username] }}
          ORG_GRADLE_PROJECT_artifactoryPassword: ${{ secrets[steps.environment.outputs.dependabot-password] }}
        with:
          java-version: ${{ env.JAVA_VERSION }}
  build-check:
    name: Build
    needs: build
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
