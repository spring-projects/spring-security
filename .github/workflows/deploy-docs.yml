name: Deploy Docs
on:
  push:
    branches:
      - "*.x"
      - "main"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork == false && github.event.repository.visibility == 'public' }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch (partial build)
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: gh workflow run deploy-docs.yml -r docs-build -f build-refname="$REF_NAME"
