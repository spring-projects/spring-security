name: Release Announcements - Stage

on:
  push:
    tags: '**'
  workflow_dispatch:
    inputs:
      version:
        description: The version to stage
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage-release-announcements:
    name: Stage Release Announcements
    permissions:
      actions: write
      contents: write
      issues: read
      pull-requests: read
    uses: spring-io/spring-security-actions/.github/workflows/release-announcements-stage.yml@ffcef17d3ba156b33fe73535fbd79594ed02b0f8 # 0.0.35
    with:
      version: ${{ inputs.version || github.ref_name }}
