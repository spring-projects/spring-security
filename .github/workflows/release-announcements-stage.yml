name: Release Announcements - Stage

on:
  push:
    tags: '**'
  workflow_dispatch:
    inputs:
      version:
        description: The version to stage
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: read
  pull-requests: read

jobs:
  stage-release-announcements:
    name: Stage Release Announcements
    uses: spring-io/spring-security-release-tools/.github/workflows/release-announcements-stage.yml@c6656e0cee9fd2930ad238f6e1cafb0b8792e515 # v1.1.0
    with:
      version: ${{ inputs.version || github.ref_name }}
    secrets: inherit
