name: Release Announcements - Stage

on:
  push:
    tags: '**'
  workflow_dispatch:
    inputs:
      version:
        description: The version to stage
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: read
  pull-requests: read

jobs:
  stage-release-announcements:
    name: Stage Release Announcements
    if: ${{ !github.event.repository.fork }}
    uses: spring-io/spring-security-release-tools/.github/workflows/release-announcements-stage.yml@c37f78964de4727660f708523173154903f5a272 # v1.0.21
    with:
      version: ${{ inputs.version || github.ref_name }}
    secrets: inherit
