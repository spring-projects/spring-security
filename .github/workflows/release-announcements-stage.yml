name: Release Announcements - Stage

on:
  push:
    tags: '**'
  workflow_dispatch:
    inputs:
      version:
        description: The version to stage
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage-release-announcements:
    name: Stage Release Announcements
    permissions:
      actions: write
      contents: write
      issues: read
      pull-requests: read
    uses: spring-io/spring-security-release-tools/.github/workflows/release-announcements-stage.yml@2da533f3d91484ee6a9346677473649e6cd08988 # v1.1.3
    with:
      version: ${{ inputs.version || github.ref_name }}
