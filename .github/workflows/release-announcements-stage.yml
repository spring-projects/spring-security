name: Release Announcements - Stage

on:
  push:
    tags: '**'
  workflow_dispatch:
    inputs:
      version:
        description: The version to stage
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage-release-announcements:
    name: Stage Release Announcements
    permissions:
      actions: write
      contents: write
      issues: read
      pull-requests: read
    uses: spring-io/spring-security-release-tools/.github/workflows/release-announcements-stage.yml@68b6e66d754df7b18604ac8e120a92ee64a336d3 # v1.1.7
    with:
      version: ${{ inputs.version || github.ref_name }}
