name: Release Announcements - Stage

on:
  push:
    tags: '**'
  workflow_dispatch:
    inputs:
      version:
        description: The version to stage
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage-release-announcements:
    name: Stage Release Announcements
    permissions:
      actions: write
      contents: write
      issues: read
      pull-requests: read
    uses: spring-io/spring-security-actions/.github/workflows/release-announcements-stage.yml@3d12f90253904da59a24c22b96c2cd0d6cec739a # 0.0.37
    with:
      version: ${{ inputs.version || github.ref_name }}
