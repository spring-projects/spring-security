name: Pull Request - Build

on: pull_request

permissions:
  contents: read

env:
  ORG_GRADLE_PROJECT_branch: ${{ github.base_ref }}
  JAVA_VERSION: '25'

jobs:
  build:
    name: Build
    runs-on: ${{ vars.UBUNTU_RUNS_ON }}
    if: github.event.repository.fork == false && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: environment
        name: Compute Build Environment
        uses: spring-io/spring-security-actions/compute-build-environment@5707602cd3a5b457f27691c2160115f35f1b0063 # 0.0.28
      - uses: spring-io/spring-security-actions/pr-build@5707602cd3a5b457f27691c2160115f35f1b0063 # 0.0.28
        env:
          ORG_GRADLE_PROJECT_releaseChannel: ${{ steps.environment.outputs.release-channel }}
          ORG_GRADLE_PROJECT_artifactoryUsername: ${{ secrets[steps.environment.outputs.dependencies-username] }}
          ORG_GRADLE_PROJECT_artifactoryPassword: ${{ secrets[steps.environment.outputs.dependencies-password] }}
        with:
          java-version: ${{ env.JAVA_VERSION }}
  build-check:
    name: Build
    needs: build
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
