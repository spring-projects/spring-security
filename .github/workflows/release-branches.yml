name: release-branches

# Every push to an embargoed branch builds the branches of its release, again from the
# pushed commit every time (nobody commits to them): release/<version> and a snapshot
# branch (none for embargoed/lts/**), or for an active embargoed branch the hotfix. Once the
# branches are pushed, the release joins the release train. What it builds, and the secret and
# the variable that it needs, are in the guide of the reusable workflow that does it:
#
#   https://github.com/spring-io/spring-security-actions/blob/0.0.20/docs/release-branches.md
#
# The reusable workflow and its actions are in the repository spring-io/spring-security-actions,
# and are called at the commit of a tag.
#
# The embargoed branches only exist in the commercial repository, so this never runs in
# this one. The commercial repository needs the secret RELEASE_AUTOMATION_TOKEN, and may set
# the variable RELEASE_TRAIN_REPOSITORY (spring-io/release-train if it is not set), and the
# variable SNAPSHOT_SUFFIX_OVERRIDES to choose -SNAPSHOT or -INTERNAL-SNAPSHOT for a dependency
# (see the docs of the workflow).

on:
  push:
    branches:
      - "embargoed/frozen/**"
      - "embargoed/active/**"
      - "embargoed/lts/**"
  # Run it by hand on an embargoed branch, for example after the due date of a milestone was set:
  # it builds the branches again from the head of the branch, and joins the train if it has not.
  workflow_dispatch:

permissions:
  contents: read

# One run at a time for a branch, and the newest wins: a run only pushes at the very end,
# once, and what it creates on the way (the issues) is found again by the next run.
concurrency:
  group: release-branches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-branches:
    name: Build the branches
    uses: spring-io/spring-security-actions/.github/workflows/release-branches.yml@0775821cbcabf7b0a3289c8b49e8bf93aaa6ecab # 0.0.20
    with:
      runs-on: ${{ vars.UBUNTU_RUNS_ON }}
      release-train-repository: ${{ vars.RELEASE_TRAIN_REPOSITORY }}
      snapshot-suffix-overrides: ${{ vars.SNAPSHOT_SUFFIX_OVERRIDES }}
    secrets:
      RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
