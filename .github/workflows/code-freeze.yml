name: "Code Freeze"
run-name: "${{ inputs.release-train }}: Code Freeze${{ inputs.dry-run && ' (dry run)' || '' }}"

# The code freeze of the project: every branch moves on to its next development version, the
# history is merged forward, the releases are marked ready in the release train, and the branches
# are pushed. It is run by hand, and only plans and checks (a dry run) unless you untick the dry
# run. What it does, the secret that it needs, and the stub that the default branch of the
# commercial repository needs, are in the guide of the reusable workflow that does it:
#
#   https://github.com/spring-io/spring-security-actions/blob/0.0.22/docs/code-freeze.md
#
# The reusable workflow and its actions are in the repository spring-io/spring-security-actions,
# and are called at the commit of a tag.
#
# It freezes the commercial repository (the OSS repository is the same name without
# -commercial), so it only runs in a repository whose name ends with -commercial: it is skipped
# in the OSS repository, which has this file too. The commercial repository needs the secret
# RELEASE_AUTOMATION_TOKEN.

"on":
  workflow_dispatch:
    inputs:
      release-train:
        description: "Release train, for example 2026.11.19"
        required: true
        type: string
      branches:
        description: "OSS branches to freeze, oldest first (7.1.x,main). Empty: all the OSS generations"
        required: false
        type: string
      lts-branches:
        description: "Long-term support generations to freeze, oldest first (6.4.x,6.5.x). Empty: all of them"
        required: false
        type: string
      dry-run:
        description: "Only log what would happen: nothing is pushed or marked ready"
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  code-freeze:
    name: Code freeze
    if: ${{ endsWith(github.repository, '-commercial') }}
    uses: spring-io/spring-security-actions/.github/workflows/code-freeze.yml@062dd632ff2ceec82ce89d494ebb1f072476ddc2 # 0.0.22
    with:
      release-train: ${{ inputs.release-train }}
      branches: ${{ inputs.branches }}
      lts-branches: ${{ inputs.lts-branches }}
      dry-run: ${{ inputs.dry-run }}
      runs-on: ${{ vars.UBUNTU_RUNS_ON }}
    secrets:
      RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
